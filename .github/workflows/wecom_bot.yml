name: Rocom Merchant

on:
  schedule:
    # 每天北京时间 08:05, 12:05, 16:05, 20:05 执行
    - cron: '5 0 * * *'   # 08:05
    - cron: '5 4 * * *'   # 12:05
    - cron: '5 8 * * *'   # 16:05
    - cron: '5 12 * * *'  # 20:05
    - cron: '12 0-13 * * *'  # 9-21点
  push:
    branches:
      - 'main'
  workflow_dispatch:      # 支持手动触发

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Check and Send Image Message
      env:
        XY_KEY: ${{ secrets.XY_KEY }}
        WECOM_KEY: ${{ secrets.WECOM_KEY }}
        WECOM_IMPORTANT_KEY: ${{ secrets.WECOM_IMPORTANT_KEY }}
      run: |
        python -c "
        import os
        import requests
        import json
        import hashlib
        import base64

        xy_key = os.environ.get('XY_KEY')
        wecom_key = os.environ.get('WECOM_KEY')
        wecom_important_key = os.environ.get('WECOM_IMPORTANT_KEY')

        # 1. 检查 JSON 接口
        json_url = f'https://apii.xianyuw.cn/api/v1/rocom-merchant?key={xy_key}&format=json&refresh='
        try:
            res = requests.get(json_url).json()
            if res.get('code') != 200:
                print('JSON API 返回错误')
                exit(1)
        except Exception as e:
            print(f'请求 JSON 失败: {e}')
            exit(1)

        items = res.get('data', {}).get('items', [])
        keywords = ['炫彩', '国王', '祝福']

        # 筛选出匹配到的关键词商品
        has_keyword = False
        for item in items:
            name = item.get('name', '')
            if any(kw in name for kw in keywords):
                print(f'匹配到关键词商品: {name}')
                has_keyword = True
                break

        # 2. 获取大图并发送（无论是否匹配关键词，都发图片）
        url_api = f'https://apii.xianyuw.cn/api/v1/rocom-merchant?key={xy_key}&format=url&refresh='
        try:
            img_res = requests.get(url_api).json()
            img_url = img_res['data']['url']
        except Exception as e:
            print(f'获取大图 URL 失败: {e}')
            exit(1)

        # 下载图片并计算 Base64 和 MD5
        try:
            download_res = requests.get(img_url)
            img_content = download_res.content
            md5_obj = hashlib.md5()
            md5_obj.update(img_content)
            img_md5 = md5_obj.hexdigest()
            img_base64 = base64.b64encode(img_content).decode('utf-8')
        except Exception as e:
            print(f'处理大图下载转码失败: {e}')
            exit(1)

        headers = {'Content-Type': 'application/json'}
        payload_img = {
            'msgtype': 'image',
            'image': {'base64': img_base64, 'md5': img_md5}
        }

        # 发图片到普通群
        wecom_webhook = f'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key={wecom_key}'
        res_img = requests.post(wecom_webhook, data=json.dumps(payload_img), headers=headers)
        print(f'普通群图片消息返回结果: {res_img.text}')

        # 3. 如果匹配到关键词，往重要群发文字"远"
        if has_keyword:
            wecom_important_webhook = f'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key={wecom_important_key}'
            payload_text = {
                'msgtype': 'text',
                'text': {'content': '远'}
            }
            res_text = requests.post(wecom_important_webhook, data=json.dumps(payload_text), headers=headers)
            print(f'重要群文字消息返回结果: {res_text.text}')
        else:
            print('未匹配到关键词商品，不发送重要提醒。')
        "
